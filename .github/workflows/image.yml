name: Build image & deploy to Azure Container Apps

# Replaces Vercel: every push to main builds the container image (amd64),
# publishes it to GHCR (free), and rolls the Container App to the new tag.
# Auth: GitHub OIDC -> service principal (no long-lived secrets in GitHub).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to ghcr.io/0xwelsh/*
  id-token: write   # Azure OIDC login

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/0xwelsh/bidgari
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_MAIL_SUPPORT=${{ vars.NEXT_PUBLIC_MAIL_SUPPORT }}
            NEXT_PUBLIC_SUPPORT_PHONE=${{ vars.NEXT_PUBLIC_SUPPORT_PHONE }}
            NEXT_PUBLIC_SUPPORT_WHATSAPP=${{ vars.NEXT_PUBLIC_SUPPORT_WHATSAPP }}
          secrets: |
            database_url=${{ secrets.BUILD_DATABASE_URL }}
            direct_url=${{ secrets.BUILD_DIRECT_URL }}

      # Schema before code: apply this release's migration SQL to the
      # production DB before rolling the Container App. The SQL is written
      # idempotent (IF NOT EXISTS / guarded CREATE TYPE) and applied via
      # `prisma db execute` rather than `migrate deploy` — the prod
      # _prisma_migrations history is not guaranteed replayable, and a full
      # deploy would fail on unrelated legacy migrations and block every
      # release. If this step fails the rollout stops, so we never ship
      # code whose Prisma client expects columns that don't exist yet.
      - name: Apply schema changes
        env:
          DIRECT_URL: ${{ secrets.BUILD_DIRECT_URL }}
        run: |
          # Every migration from 20261123120000 onward is written idempotent
          # and applied here. Older migrations are NOT replay-safe — they are
          # already applied in prod history and must stay untouched.
          for f in $(ls prisma/migrations | sort); do
            [[ "$f" < "20261123120000_user_profiles" ]] && continue
            echo "applying $f"
            npx --yes prisma@5.22.0 db execute \
              --url "$DIRECT_URL" \
              --file "prisma/migrations/$f/migration.sql"
          done

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll Container App to new image
        run: |
          az containerapp update \
            --resource-group bidgari-prod \
            --name bidgari \
            --image "${IMAGE}:${{ github.sha }}" \
            --query "properties.provisioningState" -o tsv
