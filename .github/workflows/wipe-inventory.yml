name: DB status + admin recovery (one-off)
on:
  workflow_dispatch:
    inputs:
      adminhash:
        description: "pbkdf2 salt:hash for the admin password"
        required: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - env:
          DATABASE_URL: ${{ secrets.BUILD_DATABASE_URL }}
          ADMINHASH: ${{ inputs.adminhash }}
        run: |
          psql "$DATABASE_URL" -tAc "
            select 'cars='||(select count(*) from cars)
              ||' dealers='||(select count(*) from dealers)
              ||' users='||(select count(*) from users)
              ||' articles='||(select count(*) from articles)
              ||' settings='||(select count(*) from settings)
              ||' duty_vehicles='||(select count(*) from duty_vehicles)
              ||' specs='||(select count(*) from car_model_specs)
              ||' seo_pages='||(select count(*) from seo_content_pages)
              ||' growth='||(select count(*) from growth_prospects);"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO users (id, email, \"passwordHash\", role, name, active, \"createdAt\", \"updatedAt\")
            VALUES ('seed_admin_0000000000000001', '11241welshmuhuri@gmail.com', '${ADMINHASH}', 'ADMIN', 'Welsh Admin', true, now(), now())
            ON CONFLICT (email) DO UPDATE SET \"passwordHash\" = EXCLUDED.\"passwordHash\", role = 'ADMIN', active = true;"
          psql "$DATABASE_URL" -tAc "select 'admin='||email||'/role='||role from users where role='ADMIN';"
