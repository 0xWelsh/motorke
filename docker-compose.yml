version: "3.8"
services:
  waha:
    image: devlikeapro/waha:latest
    container_name: welsh-waha
    restart: unless-stopped
    ports:
      - "3005:3000"
    volumes:
      - ./waha-sessions:/app/sessions
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_WEBHOOK_URLS: http://host.docker.internal:3000/api/whatsapp-bot/webhook
    extra_hosts:
      - "host.docker.internal:host-gateway"
